name: Validate Milan frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Check static site files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Verify required frontend files
        run: |
          test -f index.html
          test -f assets/css/styles.css
          test -f assets/js/app.js
          test -f favicon.svg
      - name: Verify HTML references external assets
        run: |
          grep -q 'assets/css/styles.css' index.html
          grep -q 'assets/js/app.js' index.html
          grep -q 'favicon.svg' index.html
